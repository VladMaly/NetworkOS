<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NetworkOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone app. Top bar, one scrolling screen, a pinned action, bottom tabs (Debrief · Next moves · Agents). The debrief is one pass over everyone: pick → tell → agents → one unified plan. */
:root {
  --outer: #E4E9E2;
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --surface-2: #EAEEE8;
  --ink: #17201C;
  --muted: #5B6862;
  --line: #D8DED7;
  --accent: #1F5B47;
  --accent-ink: #FFFFFF;
  --accent-soft: #DBEAE2;
  --mark: #A86F05;
  --mark-soft: #FAEFD4;
  --mem: #3D5A99;
  --mem-soft: #E1E8F6;
  --av-a: #DCE7F4; --av-b: #F4E1D8; --av-c: #E2EEDB; --av-d: #ECE2F2; --av-e: #F3EBCF;
  --shadow: 0 1px 2px rgba(23,32,28,.05), 0 8px 24px -14px rgba(23,32,28,.18);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --outer: #0A0E0C; --bg: #0F1412; --surface: #161D1A; --surface-2: #1F2824; --ink: #E6ECE8; --muted: #95A29B; --line: #2A3530;
    --accent: #72C6A3; --accent-ink: #0B1410; --accent-soft: #1C3229; --mark: #EDBB52; --mark-soft: #382D13;
    --mem: #9DB4EA; --mem-soft: #1E2840;
    --av-a: #22324A; --av-b: #45302A; --av-c: #26392A; --av-d: #372A45; --av-e: #3D3520;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer: #0A0E0C; --bg: #0F1412; --surface: #161D1A; --surface-2: #1F2824; --ink: #E6ECE8; --muted: #95A29B; --line: #2A3530;
  --accent: #72C6A3; --accent-ink: #0B1410; --accent-soft: #1C3229; --mark: #EDBB52; --mark-soft: #382D13;
  --mem: #9DB4EA; --mem-soft: #1E2840;
  --av-a: #22324A; --av-b: #45302A; --av-c: #26392A; --av-d: #372A45; --av-e: #3D3520;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; background: var(--surface); }
body { height: 100%; background: var(--outer); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* App shell */
.app { height: 100%; max-width: 520px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 560px) { .app { border-inline: 1px solid var(--line); box-shadow: var(--shadow); } }
.bar { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 56px; display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.screen { padding-block: 20px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.screen > *, .foot > *, .card > * { min-width: 0; }
.foot { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.foot:empty { display: none; }
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: relative; z-index: 2; }
.app { position: relative; }
/* Bottom tabs: every tab has the same 56×30 pill behind its icon, so nothing pokes out of the bar. The current tab's
   pill is tinted and its label bold; Ask AI's pill is solid, as the one action. */
.tab, .tab-ai { background: none; border: 0; padding: 8px 2px 10px; display: grid; justify-items: center; align-content: start; gap: 4px; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; min-height: 62px; cursor: pointer; }
.tab svg { box-sizing: border-box; width: 56px; height: 30px; padding: 4px 17px; border-radius: 15px; transition: background .15s, color .15s; }
.tab:hover svg { background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tab[aria-current="page"] svg { background: var(--accent-soft); }
.tab-ai { color: var(--accent); font-weight: 700; }
.tab-ai .ai-dot { width: 56px; height: 30px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 14px -8px var(--accent); transition: transform .15s; }
.tab-ai:active .ai-dot { transform: scale(.94); }
.tab-ai svg { width: 20px; height: 20px; }
.tab:focus-visible, .tab-ai:focus-visible { outline: none; }
.tab:focus-visible svg, .tab-ai:focus-visible .ai-dot { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .badge { position: absolute; top: 4px; left: calc(50% + 12px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--mark); color: var(--surface); font-size: 10.5px; display: grid; place-items: center; font-family: var(--f-mono); box-shadow: 0 0 0 2px var(--surface); }
.tab .live { position: absolute; top: 6px; left: calc(50% + 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }

/* Top bar */
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; min-width: 0; }
.brand svg { width: 24px; height: 24px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.working { color: var(--accent); border-color: var(--accent); }
.pill.working .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.pill b { color: var(--ink); font-weight: 600; font-family: var(--f-mono); }
.meter { width: 28px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.pill.low .meter i { background: var(--mark); }
@keyframes pulse { 50% { opacity: .3; } }

/* Type */
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -.02em; margin: 4px 0 8px; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin: 0 0 10px; letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.lede { margin: 0; color: var(--muted); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; min-height: 48px; font-weight: 600; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn:active:not(:disabled) { filter: brightness(.94); }
.btn.quiet { background: var(--surface-2); color: var(--ink); font-weight: 500; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.ghost:active { color: var(--ink); }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }

.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13.5px; color: var(--ink); }
.av.xs { width: 24px; height: 24px; font-size: 9.5px; }
.av.sm { width: 32px; height: 32px; font-size: 11.5px; }
.av.a { background: var(--av-a); } .av.b { background: var(--av-b); } .av.c { background: var(--av-c); } .av.d { background: var(--av-d); } .av.e { background: var(--av-e); }

/* Debrief: pick */
.steps { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ptile { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 132px; }
.ptile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.ptile .nm { font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.ptile .rl { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.ptile .when { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.ptile .tick { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; color: transparent; font-size: 13px; }
.ptile[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.known { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.known .av { margin-right: -14px; border: 2px solid var(--bg); }
.known .av:last-of-type { margin-right: 4px; }

/* Debrief: tell */
.who-row { display: flex; gap: 6px; flex-wrap: wrap; }
.who-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 13px; font-weight: 500; }
.notes-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.notes-box:focus-within { border-color: var(--accent); }
.notes-box textarea { width: 100%; min-height: 210px; border: 0; outline: none; resize: vertical; background: transparent; font-size: 16px; line-height: 1.5; }
.notes-box .tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.prompts { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }

/* Debrief: agents at work */
.yours { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; }
.yours p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.room { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.room-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: var(--surface-2); font-size: 12px; color: var(--muted); }
.room-head b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.room ol { list-style: none; margin: 0; padding: 12px; display: grid; gap: 14px; }
.room li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.room li > div { min-width: 0; }
.room .ic { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); margin-top: 6px; }
.room li.working .ic { border-color: var(--accent); animation: pulse .8s ease-in-out infinite; }
.room li.done .ic { background: var(--accent); border-color: var(--accent); }
.room li.human .ic { border-color: var(--mark); background: var(--mark); animation: pulse 1s ease-in-out infinite; }
.room li.wait { opacity: .45; }
.room .who { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.room .an { font-weight: 600; }
.harness { font-family: var(--f-mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.room .at { color: var(--accent); font-weight: 600; }
.room li.human .at { color: var(--mark); }
.split { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.split li { display: flex !important; gap: 8px; align-items: center; font-size: 13px; }
.split .n { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.split .m { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; }
.split .m.gap { color: var(--mark); }
.recall { display: block; margin-top: 6px; font-size: 12.5px; color: var(--mem); background: var(--mem-soft); border-radius: 8px; padding: 5px 8px; }
.recall::before { content: "Cognee recall · "; font-weight: 600; }
.wrote { display: block; margin-top: 6px; font-size: 12.5px; color: var(--mem); }
.wrote::before { content: "→ Cognee · "; font-weight: 600; }
.answer { display: inline-block; margin-top: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 4px 12px; font-size: 13.5px; }

.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; white-space: nowrap; min-height: 40px; }

.summary { padding: 16px; display: grid; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 12px; padding: 10px; display: grid; gap: 0; }
.stat b { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.3; }

/* Next moves */
.promises { list-style: none; margin: 0; padding: 0; }
.promises li { display: flex; gap: 10px; align-items: center; padding: 11px 14px; }
.promises li + li { border-top: 1px solid var(--line); }
.promises .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.promises .t small { display: block; color: var(--muted); font-size: 12px; }
.tag { flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.owe { background: var(--mark-soft); color: var(--mark); }
.tag.owed { background: var(--mem-soft); color: var(--mem); }
.goal-head { display: grid; gap: 2px; margin-bottom: 10px; }
.goal-head h2 { margin: 0; }
.goal-head .bar-line { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.goal-head .bar-line i { display: block; height: 100%; background: var(--accent); }
.nx-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.nx { padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.nx-top { display: flex; gap: 12px; align-items: center; }
.nx-top .id { flex: 1; min-width: 0; }
.nx-top .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; line-height: 1.25; }
.nx-top .rl { font-size: 12.5px; color: var(--muted); }
.new-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--mark-soft); color: var(--mark); padding: 1px 6px; border-radius: 4px; }
.new-tag.mem { background: var(--mem-soft); color: var(--mem); }
.score { text-align: right; display: grid; gap: 4px; justify-items: end; }
.score b { font-family: var(--f-mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.score b small { color: var(--muted); font-size: 11px; }
.ticks { display: flex; gap: 2px; }
.ticks i { width: 3px; height: 9px; border-radius: 1px; background: var(--line); }
.ticks i.on { background: var(--accent); }
.why { margin: 0; font-size: 14.5px; }
.mem-line { margin: 0; font-size: 13px; color: var(--mem); background: var(--mem-soft); border-radius: 10px; padding: 7px 10px; }
.mem-line b { font-weight: 600; }
.step { font-size: 14px; display: grid; gap: 1px; }
.draft { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; white-space: pre-wrap; }
.draft-edit { width: 100%; min-height: 170px; border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: var(--bg); resize: vertical; font-size: 16px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts .btn:first-child:nth-last-child(odd) { grid-column: 1 / -1; }
.band-line { display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 8px; border-top: 1px solid var(--line); }
.duo { position: relative; width: 50px; height: 40px; flex: none; }
.duo .av { position: absolute; top: 3px; width: 34px; height: 34px; font-size: 12px; border: 2px solid var(--surface); }
.duo .av:last-child { left: 16px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12.5px; }
.path .node { background: var(--surface-2); border-radius: 999px; padding: 2px 9px; font-weight: 500; }
.path .edge { color: var(--mem); font-family: var(--f-mono); font-size: 10.5px; }
.path .edge::after { content: " →"; }
.done-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.done-list li { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; color: var(--muted); }
.done-list li b { color: var(--ink); font-weight: 600; }

/* Agents */
.agents { list-style: none; margin: 0; padding: 0; }
.agents li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.agents li + li { border-top: 1px solid var(--line); }
.agents .mono { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--f-mono); font-size: 17px; font-weight: 500; flex: none; position: relative; }
.agents .mono.on::after { content: ""; position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); animation: pulse 1s ease-in-out infinite; }
.agents .txt { flex: 1; min-width: 0; }
.live { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card.live { padding: 14px; }
.live .lhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.lbadge { font-size: 12px; font-weight: 600; color: var(--muted); }
.lbadge.on { color: var(--accent); }
.lbadge.off { color: #B5452F; }
.live .lnote { margin: 0; color: var(--muted); font-size: 13.5px; }
.live .lnote.err { color: #B5452F; }
.lsteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lsteps li { padding: 6px 10px; border-left: 3px solid var(--line); font-size: 13.5px; }
.lsteps li div { display: grid; color: var(--muted); font-size: 12.5px; }
.lsteps li.done { border-color: var(--accent); }
.lsteps li.working { border-color: var(--accent); background: var(--surface-2); }
.lsteps li.fail { border-color: #B5452F; }
.lsteps li.wait { opacity: .6; }

/* Split one brain dump into facts per person: match names or companies, carry pronouns to the last person named. */
function extract(notes, ids) {
  const ex = {};
  ids.forEach((id) => (ex[id] = { facts: [], promises: [] }));
  let last = null;
  const sents = notes.split(/(?<=[.!?])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
  for (const s of sents) {
    const hits = ids.filter((id) => {
      const p = person(id);
      return new RegExp(`\\b(${reEsc(first(p))}|${reEsc(p.name)}|${reEsc(p.key)})\\b`, "i").test(s);
    });
    const targets = hits.length ? hits : last && /\b(she|he|they|her|him|them|his|their)\b/i.test(s) ? [last] : [];
    if (hits.length) last = hits[hits.length - 1];
    targets.forEach((id) => {
      ex[id].facts.push(s);
      if (PROMISE_RE.test(s)) ex[id].promises.push({ kind: OFFER_RE.test(s) ? "owed" : "owe", t: s });
    });
  }
  return ex;
}

/* Hero graph: your network drifts, a scan pulse radiates from you, and three top picks light up. */
let netRAF = null;
function startNet() {
  cancelAnimationFrame(netRAF);
  const cv = $("net");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, colors = {}, lastColor = -1;
  const size = () => {
    const dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    ["--line", "--muted", "--accent", "--mark", "--ink", "--surface", "--bg"].forEach((k) => (colors[k] = cs.getPropertyValue(k).trim()));
  };
  size(); readColors();
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const nodes = Array.from({ length: 52 }, () => ({ x: rnd(), y: rnd(), vx: (rnd() - 0.5) * 0.00012, vy: (rnd() - 0.5) * 0.00012, ph: rnd() * 6.28 }))
    .filter((n) => Math.hypot(n.x - 0.5, n.y - 0.5) > 0.12);
  const picks = [
    { x: 0.17, y: 0.28, label: "Alex · partner", c: "--accent", ph: 0 },
    { x: 0.83, y: 0.24, label: "Ravi · hire", c: "--accent", ph: 2 },
    { x: 0.74, y: 0.8, label: "Hana · investor", c: "--mark", ph: 4 },
  ];
  const draw = (t) => {
    if (!cv.isConnected) return;
    if (cv.clientWidth !== W) size();
    if (Math.floor(t / 1000) !== lastColor) { lastColor = Math.floor(t / 1000); readColors(); }
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, maxR = Math.hypot(W, H) / 2;
    const r = reduce ? -100 : ((t / 2800) % 1) * maxR;
    const pts = nodes.map((n) => {
      if (!reduce) {
        n.x += n.vx * 16; n.y += n.vy * 16;
        if (n.x < 0.02 || n.x > 0.98) n.vx *= -1;
        if (n.y < 0.04 || n.y > 0.96) n.vy *= -1;
      }
      return { x: n.x * W, y: n.y * H };
    });
    ctx.lineWidth = 1;
    ctx.strokeStyle = colors["--line"];
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d < 62) { ctx.globalAlpha = 1 - d / 62; ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    if (!reduce) {
      ctx.strokeStyle = colors["--accent"];
      ctx.globalAlpha = Math.max(0, 0.45 * (1 - r / maxR));
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    pts.forEach((p) => {
      const hit = Math.abs(Math.hypot(p.x - cx, p.y - cy) - r) < 16;
      ctx.fillStyle = hit ? colors["--accent"] : colors["--muted"];
      ctx.globalAlpha = hit ? 1 : 0.45;
      ctx.beginPath(); ctx.arc(p.x, p.y, hit ? 3.4 : 2.4, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const pp = picks.map((k) => ({ ...k, px: k.x * W + (reduce ? 0 : Math.sin(t / 1400 + k.ph) * 4), py: k.y * H + (reduce ? 0 : Math.cos(t / 1700 + k.ph) * 4) }));
    ctx.setLineDash([4, 5]);
    ctx.lineDashOffset = reduce ? 0 : -t / 60;
    ctx.lineWidth = 1.5;
    pp.forEach((k) => { ctx.strokeStyle = colors[k.c]; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(k.px, k.py); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.font = '600 11.5px "Instrument Sans", "Helvetica Neue", system-ui, sans-serif';
    pp.forEach((k) => {
      const glow = reduce ? 0.5 : 0.5 + 0.5 * Math.sin(t / 500 + k.ph);
      ctx.fillStyle = colors[k.c];
      ctx.globalAlpha = 0.18 * glow + 0.08;
      ctx.beginPath(); ctx.arc(k.px, k.py, 13, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(k.px, k.py, 6, 0, 6.283); ctx.fill();
      const tw = ctx.measureText(k.label).width + 14;
      let lx = k.px - tw / 2, ly = k.py + (k.y > 0.5 ? -36 : 14);
      lx = Math.max(2, Math.min(W - tw - 2, lx));
      ctx.fillStyle = colors["--surface"];
      ctx.strokeStyle = colors["--line"];
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx, ly, tw, 22, 11) : ctx.rect(lx, ly, tw, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = colors["--ink"];
      ctx.fillText(k.label, lx + 7, ly + 15);
    });
    ctx.fillStyle = colors["--ink"];
    ctx.beginPath(); ctx.arc(cx, cy, 17, 0, 6.283); ctx.fill();
    ctx.fillStyle = colors["--bg"];
    ctx.font = '700 11px "Instrument Sans", "Helvetica Neue", system-ui, sans-serif';
    const yw = ctx.measureText("You").width;
    ctx.fillText("You", cx - yw / 2, cy + 4);
    if (!reduce) netRAF = requestAnimationFrame(draw);
  };
  netRAF = requestAnimationFrame(draw);
}

function profileSteps() {
  const o = S.onb, ids = o.picked;
  const withNotes = ids.filter((id) => o.ex[id] && o.ex[id].facts.length);
  const facts = withNotes.reduce((a, id) => a + o.ex[id].facts.length, 0);
  const without = ids.length - withNotes.length;
  const rewritten = o.changes.filter((c) => c.draft).length;
  return [
    { ag: "Planner", body: `Added ${plural(facts, "fact", "facts")} to ${plural(withNotes.length, "person", "people")} from your note.${without ? ` ${plural(without, "person has", "people have")} no notes, so I'm keeping what the scan found.` : ""} <span class="at">@Strategy</span>
      <ul class="split">${ids.map((id) => { const p = person(id), n = o.ex[id] ? o.ex[id].facts.length : 0;
        return `<li><span class="av xs ${p.av}">${p.ini}</span><span class="n">${p.name}</span><span class="m">${n ? plural(n, "fact", "facts") : "from scan"}</span></li>`; }).join("")}</ul>
      <span class="wrote">add + cognify · ${plural(facts, "fact", "facts")} linked to ${plural(withNotes.length, "profile", "profiles")}</span>` },
    { ag: "Strategy", body: `${o.changes.length ? "Re-ranked with your context:" : "Your notes didn't change the ranking."} <span class="at">@Outreach</span>
      ${o.changes.length ? `<ul class="split">${o.changes.map((c) => { const p = person(c.id); return `<li><span class="av xs ${p.av}">${p.ini}</span><span class="n">${p.name}</span><span class="m ${c.to < c.from ? "gap" : ""}">${c.from} → ${c.to}</span></li>`; }).join("")}</ul>` : ""}
      <span class="recall">Goals: ${S.onb.goals.map((g) => GOALS[g]).join(" · ")}</span>` },
    { ag: "Outreach", body: `${rewritten ? `Rewrote ${plural(rewritten, "draft", "drafts")} to use what you told me.` : "Kept the drafts. They already match what you said."}<span class="recall">Sam writes short emails that lead with a number</span>` },
  ];
}
function startProfiles() {
  const o = S.onb;
  if (!o.notes.trim()) return;
  applyProfiles();
  o.phase = "profile"; o.pi = 0;
  S.board.unshift({ id: "W-02", title: "Build profiles from Sam's notes", col: "doing", owner: "Planner" });
  o.picked.forEach((id) => { if (o.ex[id].facts.length) logMem("add", "Planner", `${first(person(id))}: ${o.ex[id].facts.join(" ")}`); });
  logMem("cognify", "Planner", "Linked your notes to the scanned profiles");
  render(false);
  timer = setTimeout(profileTick, 1100);
}

function applyProfiles() {
  const o = S.onb;
  o.ex = extract(o.notes, o.picked);
  o.changes = [];
  o.picked.forEach((id) => {
    const p = person(id), facts = o.ex[id].facts;
    if (!facts.length) return;
    p.notes = facts.slice();
    const from = p.rec.score;
    if (NEG_CTX_RE.test(facts.join(" "))) {
      p.rec = { ...p.rec, score: Math.max(2, from - 4), why: `You said: “${facts.join(" ")}”`, action: "No outreach for now. Kept in memory." };
    } else if (p.ctx) {
      p.rec = { ...p.rec, ...p.ctx, promise: undefined };
      if (p.ctx.promise) p.ctxPromise = p.ctx.promise;
    }
    o.ex[id].promises.forEach((x) => { if (!p.ctxPromise && !(p.promise && p.promise.owe)) p.ctxPromise = { kind: x.kind, t: x.t, due: null }; });
    if (p.rec.score !== from || (p.ctx && p.ctx.draft)) o.changes.push({ id, from, to: p.rec.score, draft: !!(p.ctx && p.ctx.draft) });
  });
}

/* ---------- CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
const CSV_COLS = { name: /^(full )?name$/, role: /^(role|title|job title|position)$/, co: /^(company|organization|organisation|org)$/,
  where: /^(where[ _]?met|where|met|event|how we met)$/, email: /^e-?mail$/, notes: /^(notes?|context|what we discussed)$/ };
function csvPeople(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length < 2) throw new Error("The file has no rows under its header.");
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const col = Object.fromEntries(Object.entries(CSV_COLS).map(([k, re]) => [k, head.findIndex((h) => re.test(h))]));
  if (col.name < 0) throw new Error("The file needs a “name” column.");
  return rows.slice(1).map((r) => Object.fromEntries(Object.entries(col).map(([k, i]) => [k, i < 0 ? "" : (r[i] || "").trim()]))).filter((p) => p.name);
}
function contactFrom({ name, role, co, where, email, notes }) {
  name = name.replace(/\s+/g, " ");
  const parts = name.split(" ");
  const fn = parts[0];
  role = role || "Contact"; co = co || "Independent";
  const txt = `${role} ${co}`.toLowerCase();
  const goal = /invest|vc\b|angel|capital|ventures|fund|partner at|scout|principal|associate/.test(txt) ? "raise" : /engineer|developer|cto|designer|recruit/.test(txt) ? "hire" : "partners";
  const help = goal === "raise" ? "Could help with the raise." : goal === "hire" ? "Could help with the hire." : "Could become a design partner or customer.";
  const score = NEGATIVE_RE.test(notes) ? 3 : Math.min(9, 6 + (PROMISE_RE.test(notes) ? 2 : 0) + (OFFER_RE.test(notes) ? 1 : 0));
  const when = (where.match(/\(([A-Z][a-z]{2} \d{1,2})\)/) || [])[1] || "Oct 20";
  const met = where.replace(/\s*\([^)]*\)\s*$/, "");
  return { id: "u" + Math.random().toString(36).slice(2, 9), fresh: true, added: true, name, ini: (fn[0] + (parts[1] ? parts[1][0] : "")).toUpperCase(),
    av: ["a", "b", "c", "d", "e"][S.people.length % 5], role, co, key: co, when, src: "CSV import", email, signal: met ? `Met at ${met}` : "Imported from CSV",
    sample: notes || `${fn} from ${co} and I talked${met ? ` at ${met}` : ""} about working together, and I said I'd follow up next week.`,
    rec: { score, goal, why: notes ? `${notes} ${help}` : `Imported from your CSV${met ? `, met at ${met}` : ""}. ${help}`, action: "Send a short follow-up",
      research: `${co}: profile and recent news pulled`, memo: `Imported by Sam${met ? ` · met at ${met}` : ""}`,
      draft: `Hi ${fn},\n\nGreat meeting you${met ? ` at ${met}` : ""}. I'd love to keep the conversation going. Do you have 20 minutes next week?\n\nSam` } };
}
async function readCSV(file) {

    const people = csvPeople(await file.text());

    const fresh = people.filter((p) => !known.has(p.name.replace(/\s+/g, " ").toLowerCase()));

const NET_FILTERS = [["all", "All"], ["waiting", "Needs you"], ["recent", "Met recently"], ["done", "Followed up"], ["hold", "On hold"]];
function netStatus(p) {
  const n = S.next.find((x) => x.personId === p.id);
  const owe = S.promises.find((x) => x.pid === p.id && x.kind === "owe");
  if (n) {
    if (n.status === "approved") return { key: "done", cls: "done", label: "Followed up", what: "Follow-up approved today. Outreach queued the send.", n };
    if (n.status === "snoozed") return { key: "hold", cls: "skipped", label: "Snoozed", what: "Snoozed until Oct 27.", n };
    if (goalOf(p.rec) === "warm") return { key: "hold", cls: "skipped", label: "Keep warm", what: p.rec.why, n };
    return { key: "waiting", cls: "new", label: "Needs you", what: owe ? `You owe: ${owe.t.toLowerCase()}${owe.due ? ` (${owe.due.toLowerCase()})` : ""}` : `Next: ${p.rec.action.toLowerCase()}`, n };
  }
  if (p.fresh) {
    const inRun = S.d.picked.includes(p.id) && (S.d.phase === "working" || S.d.phase === "ask");
    if (inRun || !p.debriefed) return { key: "recent", cls: "info", label: inRun ? "Agents working" : "Needs debrief", what: `Met ${p.when} · ${p.src === "Added by you" ? "added by you" : `found in ${p.src}`}` };
    return { key: "hold", cls: "skipped", label: "Not now", what: `Met ${p.when}. You chose not to follow up.` };
  }
  if (p.extra) return { key: "hold", cls: "skipped", label: "In memory", what: `${p.src} · ${p.signal}` };
  return { key: "hold", cls: "skipped", label: "Not now", what: `Found: ${p.signal}` };

async function liveAsk(q) {
  try {
    const { run_id } = await liveJSON("/api/demo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: q }) });
    for (let i = 0; i < 60; i++) {

      if (r.status === "running") continue;

function localAnswer(q) {
  const open = openNext().filter((n) => goalOf(recOf(n)) !== "warm").map((n) => person(n.personId)).sort((a, b) => b.rec.score - a.rec.score);
  const named = S.people.find((p) => new RegExp(`\\b${reEsc(first(p))}\\b`, "i").test(q));
  if (named) return `${named.name}, ${named.role} at ${named.co}. ${named.rec.why} Next step: ${named.rec.action.toLowerCase()}.`;
  if (/owe|promis/i.test(q)) {
    const owe = S.promises.filter((x) => x.kind === "owe");
    return owe.length ? `You owe ${owe.length}: ${owe.map((x) => `${x.t.toLowerCase()}${x.due ? ` (${x.due.toLowerCase()})` : ""}`).join("; ")}.` : "You don't owe anyone anything right now.";
  }
  const goal = /rais|invest|fund|deck|vc/i.test(q) ? "raise" : /hir|engineer|recruit/i.test(q) ? "hire" : /partner|pilot|customer/i.test(q) ? "partners" : null;
  const list = goal ? open.filter((p) => p.rec.goal === goal) : open;
  if (!list.length) return "Nobody is lined up for that yet. Add people in your weekly debrief and I'll rank them.";
  return `Start with ${list.slice(0, 3).map((p) => `${p.name} (${p.rec.score}/10, ${p.rec.action.toLowerCase()})`).join(", then ")}. The drafts are ready for your approval below.`;
}

async function ask(text, voice = false) {
  const c = S.chat;
  text = text.trim();
  if (!text || c.busy) return;
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch {}
  c.msgs.push({ role: "user", text, voice });
  const m = { role: "assistant", text: "", pending: true };
  c.msgs.push(m);
  c.busy = true; c.draft = "";
  renderChat();
  const rules = `You are NetworkOS, a founder's AI agent team (Planner as the lead, Research, Strategy, Outreach) that keeps track of their relationships. The founder is Sam. Today is Tuesday, Oct 20.
Answer Sam's latest message using only the network data below. Reply the way you'd talk out loud: 1 to 4 short sentences, plain text, no markdown, no bullet symbols. Name the people and the concrete next step. If something isn't in the data, say you don't know yet and suggest the weekly debrief. Never say a message was sent: every message waits for Sam's approval.

NETWORK DATA
${networkContext()}`;
  const turns = [{ role: "user", content: rules }, ...c.msgs.filter((x) => x !== m && x.text && x !== c.msgs[0]).slice(-8).map((x) => ({ role: x.role, content: x.text }))];
  if (sampleFn) {
    chatCtl = new AbortController();
    try {
      const res = await sampleFn(turns, { cache: false, modelTier: "quick", signal: chatCtl.signal,
        onText: ({ text: t }) => {
          m.text = t;
          const live = $("bub-live");
          if (!m.pending && live) { live.querySelector(".tx").textContent = t; const lg = $("chat-log"); if (lg) lg.scrollTop = lg.scrollHeight; }
          else { m.pending = false; renderChat(); }
        } });
      m.text = res.text;
    } catch (e) {
      if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { sampleFn = null; m.text = localAnswer(text); }
      else if (e.code === "rate_limited") m.text = (e.text ? e.text + "\n\n" : "") + "I've hit a usage limit. Try again in a bit.";
      else if (e.code === "cancelled") m.text = e.text || "Stopped.";
      else m.text = (e.text ? e.text + "\n\n" : "") + "I lost the connection. Ask again?";
    }
  } else {

const COG = { people: null, documents: 0, nodes: 0, edges: 0, building: false, dataset: "", error: "", sending: false, poll: null, built: false };
function seedPayload(list) {

    why: p.rec.why || "", next_action: p.rec.action || "", status: (p.kind && p.kind[1]) || (p.fresh ? "Met recently" : ""),
    mutual: p.via ? person(p.via).name : "", i_promised: p.promise && p.promise.owe ? p.promise.owe : "", score: p.rec.score || 0, tags: [p.rec.goal] }));

    cogApply(d);

}

    await cogStats();
    if (COG.building) return cogPoll();
    if (!COG.built && !COG.error) {

      logMem("cognify", "Planner", `Cognee graph built: ${num(COG.nodes)} nodes, ${num(COG.edges)} edges from ${plural(COG.documents, "note", "notes")}`);

}
function signIn() { location.href = "/signin?next=" + encodeURIComponent("/?start=1"); }

/* ---------- Live: the same note, run by the real agents ----------
   The people and numbers on this page are mock data. Pressing Run also sends the note to the agents service
   (/api/demo): the Planner opens a Band room and hands off to Research, Strategy and Outreach, Cognee recalls what it
   knows and keeps the note, and the real draft waits here for approval. */
const LIVE_NAMES = { Planner: "Planner", Research: "Research", Strategist: "Strategy", Outreach: "Outreach" };
const LIVE_STAGES = ["Planner", "Research", "Strategist", "Outreach"];
const LIVE = { status: "checking", band: false, agents: {}, run: null, error: "", poll: null, extra: 0 };
async function liveJSON(url, init) {
  const r = await fetch(url, init);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || d.detail || `The agents service answered ${r.status}`);
  return d;
}
async function liveHealth() {
  try {
    const d = await liveJSON("/api/demo");
    Object.assign(LIVE, { status: "ready", band: !!d.band, agents: d.band_agents || {}, error: "" });
  } catch (e) { Object.assign(LIVE, { status: "offline", error: e.message }); }
  liveRender();
}
async function liveStart(text) {
  clearTimeout(LIVE.poll);
  Object.assign(LIVE, { status: "starting", run: null, error: "", extra: 0 });
  liveRender();
  try {
    const d = await liveJSON("/api/demo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    LIVE.status = "running";
    livePoll(d.run_id);
  } catch (e) { Object.assign(LIVE, { status: "offline", error: e.message }); liveRender(); }
}
async function livePoll(id) {
  const was = LIVE.run && LIVE.run.status;
  try { LIVE.run = await liveJSON(`/api/demo?run=${encodeURIComponent(id)}`); LIVE.error = ""; } catch (e) { LIVE.error = e.message; }
  liveRender();
  if (LIVE.run && LIVE.run.status !== was && (S.view === "moves" || S.view === "agents")) render();  // the approval card and badges
  const r = LIVE.run;
  // keep polling while it works, and a little longer for the Band room id to land
  if (!r || r.status === "running" || (!r.band_room && LIVE.band && LIVE.extra++ < 8)) LIVE.poll = setTimeout(() => livePoll(id), 1500);
}
async function liveApprove() {
  const r = LIVE.run;
  if (!r || r.status !== "waiting") return;
  try {
    LIVE.run = await liveJSON("/api/demo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ approve: r.id }) });
    toast("Approved on the real agents. Cognee is keeping the outcome.");
  } catch (e) { LIVE.error = e.message; }
  liveRender();
  if (S.view === "moves") render();
}
function liveBadge() {
  if (LIVE.status === "checking") return '<span class="lbadge">Checking Band…</span>';
  if (LIVE.status === "offline") return '<span class="lbadge off">Agents service offline</span>';
  const n = Object.keys(LIVE.agents).length;
  return LIVE.band ? `<span class="lbadge on">● Band connected · ${n} agents</span>` : '<span class="lbadge off">Band keys not set</span>';
}
function liveInner() {
  const r = LIVE.run;
  const head = `<div class="lhead"><span class="label">Live on your real agents</span>${liveBadge()}</div>`;
  if (!r) {
    const msg = LIVE.status === "starting" ? "Sending the note to the Planner…"
      : LIVE.error ? esc(LIVE.error)
      : "Press <b>Run</b>. The same note goes to RelationshipOS Planner, Research, Strategy and Outreach in Band, and Cognee recalls and keeps it. Everything else on this page is example data.";
    return head + `<p class="lnote">${msg}</p>`;
  }
  const notes = r.notes || [];
  const steps = LIVE_STAGES.map((ag, i) => {
    const st = r.status === "failed" && r.stage === i ? "fail" : r.stage > i ? "done" : r.stage === i && r.status === "running" ? "working" : "wait";
    const lines = (notes[i] || []).filter(Boolean).map((t) => `<span>${esc(t)}</span>`).join("");
    return `<li class="${st}"><b>${LIVE_NAMES[ag]}</b>${i === 0 ? ' <span class="harness">lead</span>' : ""}<div>${lines || (st === "working" ? "<span>Working…</span>" : "")}</div></li>`;
  }).join("");
  const hand = (r.handoffs || []).map((h) => `<li>${esc(LIVE_NAMES[h.from] || h.from)} → ${esc(LIVE_NAMES[h.to] || h.to)}: ${esc(h.what)}</li>`).join("");
  const mem = notes[1] && notes[1].filter(Boolean).length ? notes[1].filter(Boolean).map(esc).join(" · ") : r.stage >= 1 ? "Saving the note…" : "Waiting for the Planner";
  const room = r.band_room ? `Band room <b>${esc(r.band_room)}</b> <a href="https://app.band.ai" target="_blank" rel="noopener">Open in Band ↗</a>`
    : LIVE.band ? "Opening a Band room…" : "Band is off on the agents service, so handoffs are only recorded here.";
  const draft = r.draft_body ? `<div class="ldraft"><span class="label">Real draft${r.draft_subject ? `: ${esc(r.draft_subject)}` : ""}</span><pre>${esc(r.draft_body)}</pre>
    ${r.status === "waiting" ? '<button class="btn sm" type="button" data-act="live-approve">Approve on the real agents</button>' : r.status === "approved" ? '<span class="ok">✓ Approved. The outcome is in Cognee.</span>' : ""}</div>` : "";
  const answer = r.answer ? `<p class="lnote">${esc(r.answer)}</p>` : "";
  const err = r.error || LIVE.error ? `<p class="lnote err">${esc(r.error || LIVE.error)}</p>` : "";
  return head + `<ol class="lsteps">${steps}</ol>
    <p class="lline"><span class="tag">Cognee</span>${mem}</p>
    <p class="lline"><span class="tag">Band</span>${room}</p>
    ${hand ? `<ul class="lhand">${hand}</ul>` : ""}${answer}${draft}${err}
    <p class="lfine">Run ${esc(r.id)} · ${esc(r.status)}${r.cost_usd ? ` · $${r.cost_usd.toFixed(4)}` : ""}</p>`;
}
function liveRender() {
  const el = document.getElementById("live");
  if (el) el.innerHTML = liveInner();
  document.querySelectorAll("[data-livebadge]").forEach((b) => (b.innerHTML = liveBadge()));
}

/* ---------- Render ---------- */
function render(keepScroll = true) {
  const sc = $("scroll");
  const prev = sc.scrollTop;
  const d = S.d;
  $("bar").innerHTML = bar();
  const onboarding = S.view === "onboard" || S.view === "landing" || S.view === "demo" || S.view === "band";
  if (S.view === "band") {
    sc.innerHTML = viewBand();
    $("foot").innerHTML = `<div class="bstatus" id="band-status" role="status">${bandStatusHTML()}</div>`;
  } else if (S.view === "demo") {
    sc.innerHTML = viewDemo();
    $("foot").innerHTML = "";
  } else if (S.view === "landing") {
    sc.innerHTML = viewLanding();
    $("foot").innerHTML = `<button class="btn block" type="button" data-act="start">Find my top people · free</button>`;
    startNet();
  } else if (S.view === "onboard") {
    sc.innerHTML = viewOnboard();
    $("foot").innerHTML = footOnboard();
  } else if (S.view === "debrief") {
    sc.innerHTML = d.phase === "pick" ? viewPick() : d.phase === "tell" ? viewTell() : viewRun();
    $("foot").innerHTML = footDebrief();
  } else {

    $("foot").innerHTML = "";
  }
  const al = alertHTML();

  $("alert").hidden = !al;
  $("tabs").hidden = onboarding;
  $("tabs").innerHTML = onboarding ? "" : tabs();

  sc.scrollTop = follow ? sc.scrollHeight : keepScroll ? prev : 0;
  renderChat();
}
function go(view) { stopDictation(); S.view = view; render(false); }

/* Voice or text for any long answer. The artifact can't use the microphone, so the mic plays a sample answer word by word into the field (marked as a voice demo). */
const DICTATION = {
  pnote: () => `Prefers short emails. Ask about their plans for Q1 next time we talk.`,
  company: () => "Ledgerly, bookkeeping for freelancers who hate spreadsheets",
  "onb-notes": () => S.onb.picked.map((id) => person(id).sample).filter(Boolean).join(" "),
  notes: () => S.d.picked.map((id) => person(id).sample).join(" "),
};
let dictTimer = null, dictating = null;
function markMic(id, on) {
  const b = document.querySelector(`[data-dictate="${id}"]`);
  if (b) { b.classList.toggle("on", on); b.setAttribute("aria-label", on ? "Stop" : "Speak instead"); }
  const n = document.querySelector(`[data-dictnote="${id}"]`); if (n) n.hidden = !on;
  const alt = document.querySelector(`[data-dictnote-alt="${id}"]`); if (alt) alt.hidden = on;
}
function stopDictation() { clearInterval(dictTimer); if (dictating) markMic(dictating, false); dictating = null; }
function dictate(id) {
  if (dictating === id) { stopDictation(); return; }
  stopDictation();
  const el = $(id);
  const text = DICTATION[id] && DICTATION[id]();
  if (!el || !text) return;
  const words = text.split(" ");
  const base = id === "company" || !el.value.trim() ? "" : el.value.trim() + " ";
  let k = 0;
  dictating = id;
  markMic(id, true);
  el.value = base;
  dictTimer = setInterval(() => {
    if (!el.isConnected || k >= words.length) { stopDictation(); return; }
    el.value = base + words.slice(0, ++k).join(" ");
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }, 140);
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const ds = b.dataset;
  const d = S.d, o = S.onb;
  const n = (id) => S.next.find((x) => x.id === id);
  const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  if (ds.nav) { if (ds.filter) { S.net.filter = ds.filter; S.net.q = ""; } go(ds.nav); }
  else if (ds.filter) { S.net.filter = ds.filter; renderNetList(); }
  else if (ds.person) { S.personId = ds.person; S.forgetAsk = false; go("person"); }
  else if (ds.plan) {
    const p = person(ds.plan);
    if (!S.next.find((x) => x.personId === p.id)) {
      if (goalOf(p.rec) === "warm") p.rec = { ...p.rec, score: 5 };
      addFollowUp(p);
      logMem("add", "Strategy", `Sam added ${first(p)} to the plan`);
    }
    render();
    toast(`${p.name} added to your plan`);
  }
  else if (ds.goal) {
    const next = toggle(o.goals, ds.goal);
    if (!next.length && S.view === "settings") { toast("Keep at least one goal"); return; }
    o.goals = next; render();
  }
  else if (ds.src) { o.sources = [...o.sources, ds.src]; render(); }
  else if (ds.cand) { o.picked = toggle(o.picked, ds.cand); render(); }
  else if (ds.act === "start") { if (!ME && SIGNIN_READY) signIn(); else go("onboard"); }
  else if (ds.act === "signin") signIn();
  else if (ds.act === "signout") signOut();
  else if (ds.act === "mic") toggleMic();
  else if (ds.dictate) dictate(ds.dictate);
  else if (ds.social) {
    const p = person(S.personId), [, , val] = socialsOf(p).find(([, l]) => l === ds.social);
    if (ds.social === "Email") { navigator.clipboard?.writeText(val).then(() => toast("Email copied"), () => toast(val)); }
    else if (p.real) {
      const url = /^https?:/.test(val) ? val : ds.social === "LinkedIn" ? `https://${val}` : ds.social === "Telegram" ? `https://t.me/${val.replace(/^@/, "")}` : `tel:${val.replace(/[^+\d]/g, "")}`;
      window.open(url, "_blank", "noopener");
    }
    else toast(`Example profile: ${val}. Real links appear once accounts are connected.`);
  }
  else if (ds.act === "pnote-save") {
    const p = person(S.personId), v = ($("pnote")?.value || "").trim();
    if (!v) { toast("Write or say a note first"); return; }
    stopDictation();
    p.notes = [...(p.notes || []), v];
    S.memStats.facts += 1;
    logMem("add", "Planner", `${first(p)}: ${v}`);
    render(); toast("Saved to memory");
  }
  else if (ds.act === "forget-ask") { S.forgetAsk = true; render(); }
  else if (ds.act === "forget-no") { S.forgetAsk = false; render(); }
  else if (ds.act === "forget-yes") {
    const p = person(S.personId);
    p.forgotten = true;
    S.promises = S.promises.filter((x) => x.pid !== p.id);
    S.next.filter((n) => n.personId === p.id).forEach((n) => { n.status = "forgotten"; moveItem(n.wid, "done", "Planner", `Forgotten: ${p.name}`); });
    S.memStats.people = Math.max(0, S.memStats.people - 1);
    logMem("forget", "Planner", `Removed ${p.name} from memory at Sam's request`);
    S.forgetAsk = false;
    go("network"); toast(`${p.name} forgotten`);
  }
  else if (ds.act === "ai-open") openSheet(true);
  else if (ds.act === "band-back") go("agents");
  else if (ds.act === "band-run") {
    // With your real contacts there's no scripted run: your top priority goes straight to the real agents.
    if (REAL) { const text = realBandInput(); B = bandFresh(); B.items.push({ type: "user", text }); render(false); liveStart(text); }
    else { B = bandFresh(); bandLoadScript(B); B.running = true; B.phase = "running"; render(false); liveStart(BAND_INPUT); }
  }
  else if (ds.act === "live-approve") liveApprove();
  else if (ds.act === "band-pause") { if (B.running) { B.paused = !B.paused; render(); } }
  else if (ds.act === "band-reset") { B = bandFresh(); render(false); }
  else if (ds.act === "band-approve") bandDecide("approve");
  else if (ds.act === "band-reject") bandDecide("reject");
  else if (ds.act === "band-edit") { B.editing = true; render(); $("band-draft")?.focus(); }
  else if (ds.act === "band-edit-home") { B.editing = true; go("band"); document.querySelector(".bperm:not(.decided)")?.scrollIntoView({ block: "center" }); $("band-draft")?.focus(); }
  else if (ds.act === "band-cancel") { B.editing = false; render(); }
  else if (ds.act === "band-save") {
    const v = $("band-draft").value.trim();
    const card = [...B.items].reverse().find((i) => i.type === "approval" && !i.decided);
    if (v && card && v !== card.draft) { B.draft = v; card.draft = v; B.items.splice(B.items.indexOf(card), 0, { type: "note", text: "✎ You edited the draft." }); }
    B.editing = false; render();
  }
  else if (ds.bstep) { const it = B.items.find((i) => i.id === ds.bstep); const last = [...B.items].reverse().find((i) => i.type === "step"); B.open[ds.bstep] = !(B.open[ds.bstep] ?? it.id === last.id); render(); }
  else if (ds.btask) { const cur = B.tasks[ds.btask]; B.tasks[ds.btask] = TASK_ORDER[(TASK_ORDER.indexOf(cur) + 1) % TASK_ORDER.length]; render(); }
  else if (ds.act === "add-open") { S.net.adding = true; render(); }
  else if (ds.act === "csv-import") importCSV();
  else if (ds.act === "add-close") { S.net.adding = false; render(); }
  else if (ds.src2) connectMore(ds.src2);
  else if (ds.act === "new-round") { newRound(); render(false); }
  else if (ds.act === "ai-close") closeSheet();
  else if (ds.act === "speak") { S.chat.speak = !S.chat.speak; if (!S.chat.speak) { try { speechSynthesis.cancel(); } catch {} } if (S.view === "settings") render(); else renderChat(); }
  else if (ds.act === "demo-new") { B = bandFresh(); go("landing"); }
  else if (ds.act === "demo-regular") { startRegular(); toast("Existing user: Sam set up last week"); }
  else if (ds.day) { S.debriefDay = ds.day; render(); }
  else if (ds.ask) { openSheet(false); ask(ds.ask); }
  else if (ds.act === "to-connect") { o.phase = "connect"; render(false); }
  else if (ds.act === "connect-all") { o.sources = SOURCES.map((s) => s.id); render(); }
  else if (ds.act === "scan") startScan();
  else if (ds.act === "review") { o.phase = "review"; render(false); }
  else if (ds.act === "finish-onb") { clearTimeout(timer); finishOnboarding(); }
  else if (ds.act === "to-context") { o.phase = "context"; render(false); }
  else if (ds.act === "onb-sample") { o.notes = o.picked.map((id) => person(id).sample).filter(Boolean).join(" "); render(); }
  else if (ds.act === "profile") startProfiles();
  else if (ds.pick) { d.picked = toggle(d.picked, ds.pick); render(); }
  else if (ds.act === "to-tell") { d.phase = "tell"; render(false); }
  else if (ds.act === "back-pick") { d.phase = "pick"; render(false); }
  else if (ds.act === "sample") { d.notes = d.picked.map((id) => person(id).sample).join(" "); render(); }
  else if (ds.act === "topup") { S.credits += 100; logMem("system", "Flexprice", "Top-up: 100 credits added to Sam's wallet"); render(); toast("100 credits added"); }
  else if (ds.act === "send") send();
  else if (ds.say) answerGap(ds.say);
  else if (ds.toggle) { const x = n(ds.toggle); x.open = !x.open; x.editing = false; x.pending = undefined; render(); }
  else if (ds.edit) {
    const x = n(ds.edit);
    if (x.editing) {
      const v = $(`draft-${x.id}`).value;
      x.pending = undefined;
      if (v !== (x.draft ?? recOf(x).draft)) { x.draft = v; logMem("improve", "Planner", "Learned from your edit: keep openers short, lead with the number"); toast("Outreach will remember this style"); }
    }
    x.editing = !x.editing;
    render();
    if (x.editing) $(`draft-${x.id}`).focus();
  } else if (ds.approve) {
    const x = n(ds.approve);
    if (x.editing) x.draft = $(`draft-${x.id}`).value;
    x.status = "approved"; x.open = false; x.editing = false; x.pending = undefined;
    moveItem(x.wid, "done", "Outreach");
    S.promises = S.promises.filter((pr) => !(pr.kind === "owe" && pr.pid === x.personId));
    const p = person(x.personId);
    logMem("add", "Outreach", `Sent ${p.via ? `intro ask to ${first(person(p.via))} for ${first(p)}` : `follow-up to ${first(p)}`}, approved by Sam`);
    render();
    toast("Approved in Band. Outreach queued the send.");
  } else if (ds.snooze) {
    const x = n(ds.snooze);
    x.status = "snoozed";
    moveItem(x.wid, "todo", "Strategy");
    render();
    toast("Snoozed until Oct 27");
  } else if (b.id === "restart") restart();
  else if (b.id === "reset") { clearTimeout(timer); clearInterval(listenTimer); chatCtl?.abort(); try { speechSynthesis.cancel(); } catch {} S = SEED(); B = bandFresh(); render(false); toast("Demo restarted"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.chat.open) closeSheet(); });
document.addEventListener("change", (e) => { if (e.target.id === "csv-file" && e.target.files[0]) readCSV(e.target.files[0]); });
document.addEventListener("submit", (e) => {
  if (e.target.id !== "chat-form") return;
  e.preventDefault();
  ask($("chat-in").value);
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "company") S.onb.company = t.value;
  if (t.id === "chat-in") S.chat.draft = t.value;
  if (t.id === "net-q") { S.net.q = t.value; renderNetList(); }
  if (t.id === "onb-notes") { S.onb.notes = t.value; const b = $("build"); if (b) b.disabled = !t.value.trim(); }
  if (t.id === "notes") { S.d.notes = t.value; const s = $("send"); if (s) s.disabled = !t.value.trim(); }
  if (t.dataset && t.dataset.draft) S.next.find((x) => x.id === t.dataset.draft).pending = t.value;
});

render(false);
liveHealth();
loadMe();
cogStats();
